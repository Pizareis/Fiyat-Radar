<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>Fiyat Radar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --panel-2: #171b24;
    --border: #232834;
    --text: #e8eaed;
    --text-dim: #8b93a1;
    --accent: #5b8def;
    --accent-dim: rgba(91, 141, 239, 0.12);
    --green: #34d399;
    --red: #f87171;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 1180px; margin: 0 auto; padding: 28px 24px 60px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  .brand h1 { font-size: 1.35rem; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .live-badge { font-size: 0.75rem; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .updated-at { font-size: 0.8rem; color: var(--text-dim); }

  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .stat-card .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 8px; }
  .stat-card .value { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.red { color: var(--red); }

  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 18px; align-items: start; }

  .panel-title {
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim);
    margin: 0 0 12px 2px; font-weight: 600;
  }

  .asset-list { display: flex; flex-direction: column; gap: 8px; }
  .asset-card {
    text-align: left; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--panel);
    cursor: pointer; color: var(--text); width: 100%;
    transition: border-color .15s ease, background .15s ease;
  }
  .asset-card:hover { border-color: #34394a; }
  .asset-card.active { border-color: var(--accent); background: var(--accent-dim); }
  .asset-card .row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .asset-card .symbol { font-weight: 600; font-size: 0.95rem; }
  .asset-card .badge {
    font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 2px 6px; border-radius: 5px; font-weight: 700;
  }
  .badge.crypto { background: rgba(251, 191, 36, 0.15); color: #fbbf24; }
  .badge.forex { background: rgba(91, 141, 239, 0.15); color: #5b8def; }
  .asset-card .row2 { display: flex; justify-content: space-between; align-items: baseline; }
  .asset-card .price { font-size: 0.88rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .asset-card .change { font-size: 0.78rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .change.up { color: var(--green); }
  .change.down { color: var(--red); }
  .change.flat { color: var(--text-dim); }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 18px; }
  .card-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .card-header h2 { font-size: 1.05rem; margin: 0; font-weight: 700; }
  .card-header .current-price { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card-sub { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 16px; }
  .chart-wrap { position: relative; height: 300px; }

  .anomaly-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .anomaly-row:last-child { border-bottom: none; }
  .anomaly-icon {
    width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 1rem; flex-shrink: 0;
  }
  .anomaly-icon.spike { background: rgba(52, 211, 153, 0.12); color: var(--green); }
  .anomaly-icon.drop { background: rgba(248, 113, 113, 0.12); color: var(--red); }
  .anomaly-body { flex: 1; min-width: 0; }
  .anomaly-symbol { font-weight: 700; font-size: 0.88rem; }
  .anomaly-msg { font-size: 0.82rem; color: var(--text-dim); margin-top: 2px; }
  .anomaly-time { font-size: 0.76rem; color: var(--text-dim); white-space: nowrap; }

  .empty { color: var(--text-dim); font-style: italic; font-size: 0.88rem; padding: 8px 0; }

  @media (max-width: 800px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <h1>Fiyat Radar</h1>
      </div>
      <div class="updated-at" id="updatedAt">Yukleniyor...</div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="label">Takip Edilen Varlik</div>
        <div class="value" id="statAssets">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Aktif Anomali</div>
        <div class="value" id="statAnomalies">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Kripto / Doviz</div>
        <div class="value" id="statSplit">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Tarama Sikligi</div>
        <div class="value">5 dk</div>
      </div>
    </div>

    <div class="layout">
      <div>
        <p class="panel-title">Varliklar</p>
        <div class="asset-list" id="assetList"></div>
      </div>
      <div>
        <div class="card">
          <div class="card-header">
            <h2 id="chartTitle">-</h2>
            <div class="current-price" id="currentPrice">-</div>
          </div>
          <div class="card-sub" id="chartSub">Fiyat trendi</div>
          <div class="chart-wrap"><canvas id="priceChart"></canvas></div>
        </div>
        <div class="card">
          <div class="card-header"><h2>Son Anomaliler</h2></div>
          <div id="anomalyList"><p class="empty">Yukleniyor...</p></div>
        </div>
      </div>
    </div>
  </div>

<script>
const API = "/api";
let chart = null;
let selectedSymbol = null;
let assetsCache = [];

const fmtPrice = (v, type) => {
  if (v == null) return "-";
  const decimals = type === "forex" ? 4 : 2;
  return v.toLocaleString("tr-TR", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
};
const fmtTime = (iso) => new Date(iso).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

async function getJson(path) {
  const res = await fetch(API + path);
  if (!res.ok) throw new Error(`Request failed: ${path}`);
  return res.json();
}

function renderAssetList() {
  const list = document.getElementById("assetList");
  list.innerHTML = "";
  assetsCache.forEach((a) => {
    const card = document.createElement("button");
    card.className = "asset-card" + (a.symbol === selectedSymbol ? " active" : "");
    const changeClass = a.change_pct == null ? "flat" : a.change_pct > 0 ? "up" : a.change_pct < 0 ? "down" : "flat";
    const changeText = a.change_pct == null ? "—" : `${a.change_pct > 0 ? "+" : ""}${a.change_pct.toFixed(2)}%`;
    card.innerHTML = `
      <div class="row1">
        <span class="symbol">${a.display_name}</span>
        <span class="badge ${a.asset_type}">${a.asset_type === "crypto" ? "Kripto" : "Doviz"}</span>
      </div>
      <div class="row2">
        <span class="price">${fmtPrice(a.last_price, a.asset_type)}</span>
        <span class="change ${changeClass}">${changeText}</span>
      </div>
    `;
    card.onclick = () => { selectedSymbol = a.symbol; renderAssetList(); loadPrices(); };
    list.appendChild(card);
  });
}

async function loadAssets() {
  assetsCache = await getJson("/assets");
  if (!selectedSymbol && assetsCache.length) selectedSymbol = assetsCache[0].symbol;
  renderAssetList();

  document.getElementById("statAssets").textContent = assetsCache.length;
  const cryptoCount = assetsCache.filter((a) => a.asset_type === "crypto").length;
  const forexCount = assetsCache.length - cryptoCount;
  document.getElementById("statSplit").textContent = `${cryptoCount} / ${forexCount}`;

  const latest = assetsCache
    .map((a) => a.last_updated)
    .filter(Boolean)
    .sort()
    .pop();
  document.getElementById("updatedAt").textContent = latest ? `Son guncelleme: ${fmtTime(latest)}` : "Veri bekleniyor";
}

async function loadPrices() {
  if (!selectedSymbol) return;
  const asset = assetsCache.find((a) => a.symbol === selectedSymbol);
  const prices = await getJson(`/assets/${selectedSymbol}/prices`);

  document.getElementById("chartTitle").textContent = asset ? asset.display_name : selectedSymbol;
  document.getElementById("chartSub").textContent = `${prices.length} veri noktasi - ${asset?.asset_type === "crypto" ? "Kripto" : "Doviz"}`;
  document.getElementById("currentPrice").textContent = asset ? fmtPrice(asset.last_price, asset.asset_type) : "-";

  const labels = prices.map((p) => fmtTime(p.recorded_at));
  const data = prices.map((p) => p.price);

  const ctx = document.getElementById("priceChart").getContext("2d");
  const gradient = ctx.createLinearGradient(0, 0, 0, 300);
  gradient.addColorStop(0, "rgba(91, 141, 239, 0.28)");
  gradient.addColorStop(1, "rgba(91, 141, 239, 0.0)");

  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        data,
        borderColor: "#5b8def",
        backgroundColor: gradient,
        fill: true,
        tension: 0.3,
        pointRadius: 0,
        pointHoverRadius: 4,
        borderWidth: 2,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { intersect: false, mode: "index" },
      scales: {
        x: { ticks: { color: "#8b93a1", maxTicksLimit: 8 }, grid: { color: "#232834" } },
        y: { ticks: { color: "#8b93a1" }, grid: { color: "#232834" } },
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#171b24",
          borderColor: "#232834",
          borderWidth: 1,
          titleColor: "#e8eaed",
          bodyColor: "#e8eaed",
          padding: 10,
        },
      },
    },
  });
}

async function loadAnomalies() {
  const anomalies = await getJson("/anomalies");
  document.getElementById("statAnomalies").textContent = anomalies.length;

  const el = document.getElementById("anomalyList");
  if (!anomalies.length) {
    el.innerHTML = '<p class="empty">Henuz anomali tespit edilmedi.</p>';
    return;
  }
  el.innerHTML = anomalies.map((a) => `
    <div class="anomaly-row">
      <div class="anomaly-icon ${a.direction}">${a.direction === "spike" ? "&#9650;" : "&#9660;"}</div>
      <div class="anomaly-body">
        <div class="anomaly-symbol">${a.symbol}</div>
        <div class="anomaly-msg">${a.message}</div>
      </div>
      <div class="anomaly-time">${fmtTime(a.created_at)}</div>
    </div>
  `).join("");
}

async function refresh() {
  await loadAssets();
  await loadPrices();
  await loadAnomalies();
}

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
